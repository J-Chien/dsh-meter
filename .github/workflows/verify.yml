name: verify

# The only gate that catches a shipped-bundle regression: `smoke` loads the
# built `lib/index.js` and `lib/client.js`, so it notices a dropped export, a
# broken `__ModuleLoader__` handoff or a changed slot id that unit tests and
# tsc cannot see. Nothing ran it before this workflow existed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The runner's clock is UTC; say so explicitly, so the gate never silently
    # inherits "whatever the machine happens to be".
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false

      # Node floor is the one the README promises: `pnpm test` runs the .ts
      # suites directly through Node's native type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + build + smoke (built artifacts) + every test suite
      - run: pnpm verify

      # The peak-window and holiday logic is judged in the PROVIDER's clock,
      # never the host's, so the suite must also pass OFF +08:00. This step is
      # how a host-dependent fixture in tests/pure-check.ts was caught: it built
      # "Shanghai Friday 23:00" with `new Date(2026, 7, 21, 23)`, which is
      # Shanghai SATURDAY 07:00 under UTC — green on a +08:00 dev machine, red
      # here. Running in a third zone keeps both directions honest.
      - name: Re-run the suite outside the development timezone
        run: pnpm test
        env:
          TZ: America/New_York

      - name: Upload the built bundles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: built-lib
          path: lib/
          if-no-files-found: ignore
          retention-days: 7
